name: Build ISO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Werkzeug installieren
        run: |
          apt-get update
          apt-get install -y live-build
      - name: ISO konfigurieren
        run: |
          mkdir -p /build && cd /build
          lb config --distribution bookworm --architectures amd64 \
            --binary-images iso-hybrid --debian-installer live \
            --archive-areas "main non-free-firmware" --iso-volume LumenOS \
            --bootappend-live "boot=live components quiet noautologin"
          mkdir -p config/package-lists config/hooks/normal config/includes.chroot/etc/skel \
            config/includes.chroot/etc/systemd/system/getty@tty1.service.d
          printf 'cage\nchromium\nnetwork-manager\nsudo\nfirmware-linux\nfirmware-iwlwifi\nfirmware-realtek\n' > config/package-lists/lumen.list.chroot
          cat > config/hooks/normal/0100-user.hook.chroot <<'EOF'
          #!/bin/sh
          useradd -m -s /bin/bash -G audio,video,netdev,sudo lumen
          echo "lumen:lumen" | chpasswd
          EOF
          chmod +x config/hooks/normal/0100-user.hook.chroot
          cat > config/includes.chroot/etc/systemd/system/getty@tty1.service.d/autologin.conf <<'EOF'
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin lumen --noclear %I $TERM
          EOF
          cat > config/includes.chroot/etc/skel/.bash_profile <<'EOF'
          if [ -z "$WAYLAND_DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then
            exec cage -- chromium --kiosk --no-first-run --noerrdialogs https://lumen-os-pro.base44.app
          fi
          EOF
      - name: ISO bauen
        run: cd /build && lb build
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-iso
          path: /build/*.iso
